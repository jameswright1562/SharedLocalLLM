[package]
name = "shared-local-llm"
version = "0.2.0"
description = "Two-node local LLM orchestration with a Python inference backend"
authors = ["SharedLocalLLM contributors"]
edition = "2021"

[lib]
name = "shared_local_llm"
path = "src/lib.rs"

[[bin]]
name = "shared-local-llm"
path = "src/main.rs"

[build-dependencies]
ico = "0.5"
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "time"] }
