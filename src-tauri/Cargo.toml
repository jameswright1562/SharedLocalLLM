[package]
name = "shared-local-llm"
version = "0.1.2"
description = "Secure two-node local LLM orchestration"
authors = ["SharedLocalLLM contributors"]
edition = "2021"

[lib]
name = "shared_local_llm"
path = "src/lib.rs"

[[bin]]
name = "shared-local-llm"
path = "src/main.rs"

[build-dependencies]
ico = "0.5"
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
futures-util = "0.3"
get_if_addrs = "0.5"
glob = "0.3"
hex = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
llama-cpp-4 = { version = "0.5.1", features = ["cuda", "openmp", "mtmd"] }
llama-cpp-sys-4 = { version = "0.5.1", features = ["rpc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
