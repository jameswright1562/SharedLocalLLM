version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-toolchain:
        patterns:
          - "@vitejs/*"
          - "@vitest/*"
          - vite
          - vitest
      tauri-javascript:
        patterns:
          - "@tauri-apps/*"
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
