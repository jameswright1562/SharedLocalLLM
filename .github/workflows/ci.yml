name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests and coverage
        run: pnpm test:coverage
      - name: Production web build
        run: pnpm build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  python-backend:
    name: Python backend checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pytest psutil fastapi uvicorn httpx numpy
      - name: Compile Python sources
        run: python -m compileall -q backend/sharedlocalllm_backend
      - name: Unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "backend"
          python -m pytest backend/tests

  rust:
    name: Thin Tauri shell checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      # tauri.conf.json bundles ../backend/dist/sharedlocalllm-backend.exe and
      # tauri-build refuses to run when that path is missing. Real builds get
      # it from `pnpm backend:package`; the check job only needs the file to
      # exist, so a stub keeps fmt/test/clippy runnable without PyInstaller.
      - name: Stub the packaged backend resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/dist | Out-Null
          New-Item -ItemType File -Force -Path backend/dist/sharedlocalllm-backend.exe | Out-Null
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  browser:
    name: Browser workflows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Run browser workflows
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-installer:
    name: Unsigned Windows installer
    needs: [frontend, python-backend, rust, browser]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CUDA toolkit for llama-cpp-python packaging
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.2.0"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: Write installer checksum
        shell: pwsh
        run: |
          $bundlePath = Resolve-Path "src-tauri/target/release/bundle/nsis"
          $installers = Get-ChildItem -LiteralPath $bundlePath -Filter "*.exe" -File
          if ($installers.Count -eq 0) { throw "The NSIS build produced no installer." }
          $lines = $installers | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $bundlePath "SHA256SUMS.txt") -Encoding ascii
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SharedLocalLLM-windows-x64-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
